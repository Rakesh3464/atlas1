name: Build & Package A21s 5.10 Kernel

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses-dev libssl-dev lzop rsync schedtool squashfs-tools unzip zip zlib1g-dev clang lld llvm

      - name: Setup Build Environment
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out

      - name: Compile Kernel & DTBO
        run: |
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 a21s_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 Image dtbo.img

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          cp out/arch/arm64/boot/Image anykernel/
          cp out/arch/arm64/boot/dtbo.img anykernel/ || true
          cd anykernel
          zip -r ../A21s-5.10-Kernel.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A21s-5.10-Kernel-Zip
          path: A21s-5.10-Kernel.zip
          
