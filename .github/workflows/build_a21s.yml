name: Build & Package A21s 5.10 Kernel

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev clang lld llvm

      - name: Setup Build Environment
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out

      - name: Compile Kernel & DTBO
        run: |
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 a21s_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 Image dtbo.img

      - name: Package with AnyKernel3Actions
        id: ak3
        uses: MizProject/AnyKernel3Actions@main
        with:
          kernel-dir: out/arch/arm64/boot
          kernel-string: "A21s-5.10-CustomKernel {kernel_version}"
          do-devicecheck: "1"
          device-names: "a21s,SM-A217F"
          block: "/dev/block/by-name/boot"
          is-slot-device: "0"
          zip-name: "A21s-5.10-Kernel-{date}.zip"
          output-dir: dist
          strict: "true"

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A21s-5.10-Kernel-Zip
          path: ${{ steps.ak3.outputs.zip-path }}
          
